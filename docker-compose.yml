name: reconstruyehome

services:
  front:
    build:
      context: ./apps/front
      target: development
    init: true
    environment:
      API_PROXY_TARGET: http://back:3000
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-4200}:4200"
    volumes:
      - ./apps/front/src:/workspace/src:ro
      - ./apps/front/public:/workspace/public:ro
      - ./apps/front/proxy.conf.cjs:/workspace/proxy.conf.cjs:ro
    depends_on:
      back:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4200/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 12

  back:
    build:
      context: .
      dockerfile: apps/back/Dockerfile
      target: development
    init: true
    environment:
      NODE_ENV: development
      AUTH_MODE: local
      COOKIE_SECURE: "false"
      PORT: "3000"
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-4200},http://127.0.0.1:${FRONTEND_PORT:-4200}
      DB_HOST: database
      DB_PORT: "1433"
      DB_NAME: ${DATABASE_NAME:-reconstruyehome}
      DB_USER: sa
      DB_PASSWORD: ${DATABASE_PASSWORD:?Copia .env.example a .env y configura DATABASE_PASSWORD}
      DB_ENCRYPT: "true"
      DB_TRUST_SERVER_CERTIFICATE: "true"
      DB_INITIALIZE: "true"
      DB_MIGRATE: "true"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-7071}:3000"
    volumes:
      - ./apps/back/src:/workspace/src:ro
      - ./apps/back/test:/workspace/test:ro
      - ./infra/database/migrations:/workspace/migrations:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${DATABASE_PASSWORD:?Copia .env.example a .env y configura DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${DATABASE_PORT:-1433}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -C -b -Q 'SELECT 1' -o /dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 18

volumes:
  sqlserver_data:
